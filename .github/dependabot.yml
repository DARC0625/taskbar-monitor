version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '11:30'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    groups:
      compatible-rust-updates:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: 'build(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '11:45'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'
