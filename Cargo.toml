[package]
name = "taskbar-monitor"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "A compact, native Windows taskbar monitoring widget"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.3.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_DXCore",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_DirectComposition",
  "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_System_Wmi", "Win32_System_Variant", "Win32_System_Ole",
  "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_Security"
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.11"
